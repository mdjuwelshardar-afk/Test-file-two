name: Auto Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.github/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build-apk:
    name: Build APK (${{ github.event.inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 🔍 Flutter Doctor
        run: flutter doctor -v

      - name: 📦 Get Packages
        run: flutter pub get

      - name: 🔎 Analyze Code
        run: flutter analyze

      - name: 📝 Check Formatting
        run: dart format --set-exit-if-changed lib/

      - name: 🧪 Run Tests
        run: flutter test || echo "No tests found, skipping..."

      - name: 🔧 Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build apk --debug

      - name: 📤 Upload Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: minarah-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: 🚀 Build Release APK (split per ABI)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build apk --release --split-per-abi

      - name: 📤 Upload Release APK (arm64-v8a)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: minarah-release-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      - name: 📤 Upload Release APK (armeabi-v7a)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: minarah-release-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30

      - name: 📤 Upload Release APK (x86_64)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: minarah-release-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: 🏪 Build AppBundle
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        run: flutter build appbundle --release

      - name: 📤 Upload AppBundle
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: minarah-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║     MINARAH Islamic Hub BD — Build      ║"
          echo "║     Workflow Completed Successfully!     ║"
          echo "╚══════════════════════════════════════════╝"
